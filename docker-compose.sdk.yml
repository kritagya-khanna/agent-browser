services:
  # ---------------------------------------------------------------------------
  # Android Emulator Service (The "Body")
  # ---------------------------------------------------------------------------
  android-service:
    image: kritchoff/agent-android:v1.0.8
    platform: linux/amd64
    privileged: true # Required for KVM
    restart: always  # Auto-restart on crash
    ports:
      - "5566:5555" # ADB (Host access)
      - "9235:9224" # CDP (Host access)
      - "6091:6080" # NoVNC
    environment:
      - EMULATOR_NAME=Pixel_6_API_34
      - BROWSER=wootzapp
      - EMULATOR_ACCEL=1
      - EMULATOR_SNAPSHOT_NAME=${EMULATOR_SNAPSHOT_NAME:-}
    devices:
      - /dev/kvm:/dev/kvm
    volumes:
      - avd-data:/root/.android
      - agent-snapshots:/root/.android/avd/Pixel_6_API_34.avd/snapshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9224/json/version"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    networks:
      - agent-network

  # ---------------------------------------------------------------------------
  # Agent Browser Service (The "Brain")
  # ---------------------------------------------------------------------------
  agent-service:
    image: kritchoff/agent-daemon:v1.0.8
    platform: linux/amd64
    restart: always
    depends_on:
      - android-service
    ports:
      - "32001:3000" # Agent Control Port (Uncommon port to avoid conflicts)
    environment:
      - AGENT_DEBUG=false
      - AGENT_BROWSER_SOCKET_DIR=/tmp/agent-browser
    networks:
      - agent-network

volumes:
  avd-data:
  agent-snapshots:

networks:
  agent-network:
    driver: bridge
